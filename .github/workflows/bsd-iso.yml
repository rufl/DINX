name: DINX-BSD ISO build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/dinx-bsd
  pull_request:
    branches:
      - main

concurrency:
  group: dinx-bsd-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-bsd-iso:
    name: Build and install DINX-BSD in QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout DINX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install DINX-BSD build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libarchive-tools qemu-system-x86 qemu-utils xorriso
      - name: Restore checksum-pinned FreeBSD source ISO
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/bsd-cache/FreeBSD-15.1-RELEASE-amd64-disc1.iso
          key: freebsd-15.1-amd64-disc1-fa27646f05a1440f
      - name: Run DINX-BSD contract validation
        run: ./scripts/check_dinx_bsd.sh
      - name: Build ISO and prove unattended installation
        env:
          DINX_BSD_QEMU_TIMEOUT: 1200
        run: ./scripts/build-bsd.sh
      - name: Upload ISO and qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dinx-bsd-${{ job.status }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
          path: |
            dist/bsd-iso/DINX-BSD-15.1-RELEASE-amd64.iso
            dist/bsd-iso/DINX-BSD-15.1-RELEASE-amd64.iso.sha256
            dist/bsd-iso/build-metadata.txt
            dist/bsd-iso/dinx-bsd-install.qemu.log

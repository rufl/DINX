name: DINX-BSD Validation

on:
  push:
    branches:
      - main
      - feature/dinx-bsd
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-bsd:
    name: Validate DINX-BSD contracts and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout DINX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate BSD build scripts
        run: |
          bash -n scripts/build-bsd.sh scripts/build-bsd-iso.sh scripts/check-bsd-iso.sh
          python3 -m py_compile scripts/build-bsd-iso-unattended.py
      - name: Run DINX-BSD contract validation
        run: ./scripts/check_dinx_bsd.sh

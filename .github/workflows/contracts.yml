name: DINX contracts

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read

concurrency:
  group: dinx-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Static and fixture contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout DINX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore verified Zig toolchain archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: dist/.cache/dinx/toolchains
          key: dinx-toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/p0-iso.yml', 'scripts/build-iso-container.sh', 'scripts/cache-verified-download.sh', 'distro/packages/pearl/source.env') }}
          restore-keys: |
            dinx-toolchains-${{ runner.os }}-${{ runner.arch }}-
      - name: Install contract tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl jq python3-venv zstd
      - name: Verify REUSE metadata
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/pip" install --quiet reuse
          "$RUNNER_TEMP/reuse/bin/reuse" lint
      - name: Read pinned Deetty/Dintor source revision
        id: deetty-source
        run: |
          ref=$(awk -F= '$1 == "DEETTY_REF" { print $2; exit }' distro/packages/deetty/source.env)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { printf 'Invalid DEETTY_REF in source.env\n' >&2; exit 1; }
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned public NOCTTY source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rufl/NOCTTY
          ref: ${{ steps.deetty-source.outputs.ref }}
          token: ${{ github.token }}
          path: third_party/noctty
          persist-credentials: false
      - name: Prepare pinned Deetty/Dintor source archive
        run: ./scripts/prepare_first_party_apps.sh third_party/noctty
      - name: Install pinned Zig for source smokes
        run: |
          zig_version=0.17.0
          zig_archive="zig-x86_64-linux-${zig_version}.tar.xz"
          zig_sha256=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
          zig_archive_path="$GITHUB_WORKSPACE/dist/.cache/dinx/toolchains/$zig_archive"
          scripts/cache-verified-download.sh \
            "$zig_archive_path" \
            "https://ziglang.org/download/${zig_version}/${zig_archive}" \
            "$zig_sha256"
          tar -xJf "$zig_archive_path" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-${zig_version}" >> "$GITHUB_PATH"

      - name: Run DINX static and fixture contracts
        run: ./scripts/check_dinx_contracts.sh

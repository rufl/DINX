name: Mission Center lean package

# Run on task-branch changes so NEXT can consume a published artifact without
# compiling Mission Center in the ISO workflow.

on:
  schedule:
    - cron: "37 7 */3 * *"
  push:
    branches:
      - feat/taskmgr/mission
    paths:
      - ".github/workflows/mission-center.yml"
      - "distro/packages/mission-center/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dinx-mission-center
  cancel-in-progress: false

jobs:
  build:
    name: Build Mission Center lean package
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout DINX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage precompiled Mission Center package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/mission-center
          gh release download dinx-packages-latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'mission-center-*.pkg.tar.zst' \
            --dir dist/mission-center \
            --clobber
          mapfile -t packages < <(find dist/mission-center -maxdepth 1 -type f -name 'mission-center-*.pkg.tar.zst' -print)
          [[ "${#packages[@]}" -eq 1 ]] || { printf 'Expected exactly one precompiled Mission Center package\n' >&2; exit 1; }
          pkgver=$(awk -F= '$1 == "pkgver" { print $2; exit }' distro/packages/mission-center/PKGBUILD)
          pkgrel=$(awk -F= '$1 == "pkgrel" { print $2; exit }' distro/packages/mission-center/PKGBUILD)
          target="dist/mission-center/mission-center-${pkgver}-${pkgrel}-x86_64.pkg.tar.zst"
          mv -- "${packages[0]}" "$target"
          sha256sum "$target" | tee dist/mission-center/SHA256SUMS

      - name: Upload lean package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mission-center-lean-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: dist/mission-center/

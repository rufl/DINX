name: P0 ISO foundation

on:
# This workflow intentionally does not run on pull requests: the build uses a privileged container.
# Add an isolated validation workflow before enabling any pull-request trigger.
  workflow_dispatch:
  workflow_call:
    inputs:
      require_persistent_package_signing:
        description: Require the production package-signing secret for a published release
        required: false
        type: boolean
        default: false
    secrets:
      DINX_PACKAGE_SIGNING_KEY:
        required: false
      DINX_PACKAGE_SIGNING_FINGERPRINT:
        required: false
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p0-iso.yml"
      - ".github/workflows/release.yml"
      - "distro/iso/**"
      - "distro/packages/**"
      - "scripts/build-iso.sh"
      - "scripts/check_wizp_package.sh"
      - "scripts/check-iso-content.sh"
      - "scripts/check_dinx_package_repository.sh"
      - "scripts/check_dinx_package_provenance.sh"
      - "scripts/check_dinx_release_preflight.sh"
      - "scripts/smoke_dinx_update.sh"
      - "scripts/check_dinx_feature_groups.sh"
      - "scripts/check_build_metadata.sh"
      - "scripts/check-iso-host.sh"
      - "scripts/check_dinx_theme.sh"
      - "scripts/check_noctty_integration.sh"
      - "scripts/nocted_p3_qualification.sh"
      - "scripts/noctty_p2_qualification.sh"
      - "scripts/prepare_first_party_apps.sh"
      - "scripts/check_first_party_apps.sh"
      - "scripts/smoke-iso.sh"
      - "scripts/smoke-install.sh"
      - "scripts/check_calamares_partitioning.sh"
      - "scripts/smoke_calamares_partitioning.sh"
      - "scripts/smoke_calamares_startup.sh"
      - "scripts/smoke_calamares_windows.sh"
      - "scripts/smoke-iso.ps1"
      - "scripts/package-windows-qemu.sh"
      - "scripts/deploy-ztash.sh"
      - "tools/dinx-qemu-launcher.c"
      - "scripts/check_firefox.sh"
      - "scripts/check_swayimg.sh"
      - "scripts/check_package_managers.sh"
      - "scripts/check_desktop_packages.sh"
      - "scripts/check_firewall_tools.sh"
      - "scripts/check_cyan_skillfish.sh"
      - "scripts/check_bc250_control_center.sh"
      - "scripts/check_dinitui.sh"
      - "scripts/check_dinxpanel.sh"
      - "scripts/check_dinx_session.sh"
      - "scripts/check_dinx_budget.sh"
      - "scripts/measure_dinx_session.sh"
      - "scripts/smoke_dinx_session.sh"
      - "scripts/check_gaming.sh"
      - "scripts/check_alpha7_hardware_report.sh"
      - "scripts/check_dinx_hardware_evidence.sh"
      - "scripts/dinitui_dinit_qualification.sh"
      - "scripts/gaming_p5_qualification.sh"
      - "LICENSE"

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: p0-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build and smoke-test DINX foundation ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout DINX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned NOCTTY and NoctEd source archive
        run: ./scripts/check_first_party_apps.sh
      - name: Verify Noctty desktop and shell integration
        run: ./scripts/check_noctty_integration.sh
      - name: Verify Firefox defaults and pro-user policy
        run: ./scripts/check_firefox.sh

      - name: Verify pinned swayimg source and package contract
        run: ./scripts/check_swayimg.sh
      - name: Verify pinned package-management sources and payload contract
        run: ./scripts/check_package_managers.sh
      - name: Verify scanner, firmware, Flatpak and image-editor payload
        run: ./scripts/check_desktop_packages.sh
      - name: Verify WIZP package staging and desktop contract
        run: ./scripts/check_wizp_package.sh
      - name: Verify DINX package provenance policy
        run: scripts/check_dinx_package_provenance.sh
      - name: Verify DINX feature-group coverage
        run: scripts/check_dinx_feature_groups.sh
      - name: Verify Cyan Skillfish and BC-250 support contract
        run: ./scripts/check_cyan_skillfish.sh
      - name: Verify BC250 Control Center package and session contract
        run: ./scripts/check_bc250_control_center.sh
      - name: Verify firewall and process-monitoring payload contract
        run: ./scripts/check_firewall_tools.sh
      - name: Verify DinitUI package and privilege contract
        run: ./scripts/check_dinitui.sh
      - name: Verify DINXPanel control-center and kernel contract
        run: ./scripts/check_dinxpanel.sh
      - name: Verify DINX lock, idle, brightness and launcher hierarchy contract
        run: ./scripts/check_dinx_session.sh
      - name: Verify installer lifecycle boundary
        run: ./scripts/check_install_lifecycle.sh
      - name: Verify Calamares partitioning contract
        run: ./scripts/check_calamares_partitioning.sh
      - name: Verify DINX payload and startup budgets
        run: ./scripts/check_dinx_budget.sh
      - name: Capture host session measurement context
        run: ./scripts/measure_dinx_session.sh
      - name: Smoke-test DINX lock and idle argv
        run: ./scripts/smoke_dinx_session.sh
      - name: Verify gaming session and 32-bit graphics contract
        run: ./scripts/check_gaming.sh
      - name: Verify Alpha 7 hardware-report contract
        run: ./scripts/check_alpha7_hardware_report.sh

      - name: Install QEMU and ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes btrfs-progs dosfstools ntfs-3g grub-efi-amd64-bin ovmf qemu-system-x86 qemu-utils squashfs-tools xorriso socat grub-pc-bin
      - name: Smoke-test Calamares partition transaction
        run: sudo ./scripts/smoke_calamares_partitioning.sh
      - name: Smoke-test Windows side-by-side and manual partition transactions
        run: sudo ./scripts/smoke_calamares_windows.sh

      - name: Build with Artix artools
        env:
          DINX_PACKAGE_SIGNING_KEY: ${{ inputs.require_persistent_package_signing && secrets.DINX_PACKAGE_SIGNING_KEY || '' }}
          DINX_PACKAGE_SIGNING_FINGERPRINT: ${{ inputs.require_persistent_package_signing && secrets.DINX_PACKAGE_SIGNING_FINGERPRINT || '' }}
          DINX_REQUIRE_PERSISTENT_PACKAGE_SIGNING: ${{ inputs.require_persistent_package_signing }}
        run: |
          mkdir -p "$RUNNER_TEMP/dinx-artools" "$GITHUB_WORKSPACE/dist/iso"
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/dinx-artools:/var/lib/artools/buildiso" \
            --workdir /workspace \
            --env DINX_ISO_OUTPUT=/workspace/dist/iso \
            --env DINX_COMMIT="$GITHUB_SHA" \
            --env DINX_RUN_ID="$GITHUB_RUN_ID" \
            --env DINX_REPOSITORY="$GITHUB_REPOSITORY" \
            --env DINX_PACKAGE_SIGNING_KEY \
            --env DINX_PACKAGE_SIGNING_FINGERPRINT \
            --env DINX_REQUIRE_PERSISTENT_PACKAGE_SIGNING \
            artixlinux/artixlinux@sha256:e746e31ffe48f9526759711de0a3bc4cb7a8f61d7339dc9b11fe6bee4a722507 \
            bash -ceu "$(cat <<'DINX_CONTAINER_SCRIPT'
              set -euxo pipefail
              pacman_retry() {
                local attempt
                for attempt in 1 2 3; do
                  if pacman "$@"; then
                    return 0
                  fi
                  if [[ "$attempt" -lt 3 ]]; then
                    sleep 15
                  fi
                done
                return 1
              }
              pacman_retry -Syu --noconfirm
              pacman_retry -S --needed --noconfirm \
                artools \
                iso-profiles \
                mkinitcpio \
                base-devel \
                bubblewrap \
                bash-completion \
                btop \
                curl \
                clang \
                cairo \
                cjson \
                calamares \
                calamares-extensions \
                dbus \
                dialog \
                dinit \
                fzf \
                gdk-pixbuf2 \
                glances \
                glib2 \
                go-md2man \
                gettext \
                git \
                gnupg \
                glslang \
                glycin \
                gtk-layer-shell \
                gamescope \
                fontconfig \
                freetype2 \
                gtk3 \
                gtk4 \
                libadwaita \
                libarchive \
                gtksourceview4 \
                vte3 \
                ghostty \
                hicolor-icon-theme \
                adwaita-icon-theme \
                less \
                libdisplay-info \
                libdrm \
                libepoxy \
                libglvnd \
                libinput \
                libliftoff \
                libnewt \
                libpng \
                librsvg \
                libxcb \
                libxkbcommon \
                luajit \
                man-db \
                mesa \
                meson \
                nano \
                ninja \
                openssh \
                pango \
                pcre2 \
                pixman \
                pkgconf \
                procps-ng \
                python \
                seatd \
                shared-mime-info \
                sqlite \
                texinfo \
                tmux \
                util-linux \
                wayland \
                wayland-protocols \
                vim \
                xcb-util-errors \
                xcb-util-renderutil \
                xcb-util-wm \
                xorg-xwayland \
                xorg-server-xvfb \
                xz \
                zlib \
                rust
              update-mime-database /usr/share/mime
              mkdir -p /usr/lib/gdk-pixbuf-2.0/2.10.0
              gdk-pixbuf-query-loaders --update-cache
              zig_version=0.17.0
              zig_archive="zig-x86_64-linux-${zig_version}.tar.xz"
              zig_sha256=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
              curl --fail --silent --show-error --location --retry 3 \
                --output "/tmp/$zig_archive" \
                "https://ziglang.org/download/${zig_version}/${zig_archive}"
              actual_zig_sha=$(sha256sum "/tmp/$zig_archive" | cut -d " " -f 1)
              printf "zig_sha256=%s\n" "$actual_zig_sha"
              test "$actual_zig_sha" = "$zig_sha256"
              tar -xJf "/tmp/$zig_archive" --directory /tmp
              export PATH="/tmp/zig-x86_64-linux-${zig_version}:$PATH"
              actual_zig_version=$(zig version)
              printf "zig_version=%s\n" "$actual_zig_version"
              test "$actual_zig_version" = "$zig_version"
              # Run before makepkg --clean removes source trees used by the static theme contract.
              scripts/check_dinx_theme.sh
              package_repo=/workspace/dist/packages
              rm -rf "$package_repo"
              mkdir -p "$package_repo"
              useradd --create-home --user-group dinxbuild
              chown -R dinxbuild:dinxbuild /workspace/distro/packages "$package_repo"
              signing_home=/tmp/dinx-package-signing
              rm -rf "$signing_home"
              install -d -m 700 "$signing_home"
              package_repository_channel=ci
              package_signing_mode=ephemeral-ci
              if [[ "${DINX_REQUIRE_PERSISTENT_PACKAGE_SIGNING:-false}" == true ]]; then
                set +x
                package_key_present=false
                if [[ -n "${DINX_PACKAGE_SIGNING_KEY:-}" ]]; then
                  package_key_present=true
                fi
                set -x
                if [[ "$package_key_present" != true ]]; then
                  printf 'A persistent DINX_PACKAGE_SIGNING_KEY is required for this release build.\n' >&2
                  exit 1
                fi
                package_repository_channel=stable
                package_signing_mode=persistent
                signing_key_file="$signing_home/private.asc"
                set +x
                printf '%s\n' "$DINX_PACKAGE_SIGNING_KEY" > "$signing_key_file"
                gpg --batch --homedir "$signing_home" --import "$signing_key_file" >/dev/null
                rm -f "$signing_key_file"
                set -x
              else
                printf '%s\n' \
                  '%no-protection' \
                  'Key-Type: RSA' \
                  'Key-Length: 3072' \
                  'Name-Real: DINX CI package repository' \
                  'Name-Email: ci@dinx.invalid' \
                  'Expire-Date: 0' \
                  '%commit' \
                  > "$signing_home/keyparams"
                gpg --batch --homedir "$signing_home" --generate-key "$signing_home/keyparams" >/dev/null
              fi
              signing_key=$(gpg --batch --homedir "$signing_home" --with-colons --list-secret-keys \
                | awk -F: '$1 == "fpr" { print $10; exit }')
              [[ "$signing_key" =~ ^[A-Fa-f0-9]{40}$ ]]
              if [[ -n "${DINX_PACKAGE_SIGNING_FINGERPRINT:-}" ]]; then
                [[ "${signing_key,,}" == "${DINX_PACKAGE_SIGNING_FINGERPRINT,,}" ]] \
                  || { printf 'DINX_PACKAGE_SIGNING_FINGERPRINT does not match the imported key.\n' >&2; exit 1; }
              fi
              gpg --batch --homedir "$signing_home" --export "$signing_key" \
                > "$package_repo/dinx-package-signing-key.gpg"
              chown -R dinxbuild:dinxbuild "$signing_home"
              pacman-key --add "$package_repo/dinx-package-signing-key.gpg"
              pacman-key --init
              pacman-key --lsign-key "$signing_key"

              build_package() {
                local package_name="$1"
                local package_dir="/workspace/distro/packages/$package_name"
                local -a extra_env=()
                if [[ "$package_name" == noctty ]]; then
                  extra_env=(GLYCIN_DISABLE_SANDBOX=i-know-the-risks)
                fi
                (
                  cd "$package_dir"
                  runuser -u dinxbuild -- env "${extra_env[@]}" \
                    GNUPGHOME="$signing_home" \
                    makepkg --clean --nodeps --nocheck --noconfirm \
                    --sign --key "$signing_key"
                )
                find "$package_dir" -maxdepth 1 -type f \
                  \( -name "*.pkg.tar.zst" -o -name "*.pkg.tar.zst.sig" \) \
                  -exec cp -- {} "$package_repo/" \;
              }
              build_package opensnitch-dinit
              build_package cyan-skillfish-governor-smu
              build_package cyan-skillfish-governor-smu-dinit
              build_package bc250-control-center
              build_package topgrade
              build_package paru
              build_package shelly
              build_package dinitui
              pacman -U --noconfirm "$package_repo"/dinitui-*.pkg.tar.zst
              DINITUI_BIN=/usr/bin/dinitui scripts/dinitui_dinit_qualification.sh
              scripts/smoke_calamares_startup.sh
              build_package dinxpanel
              source /workspace/distro/packages/noctty/source.env
              [[ -n "$NOCTTY_VERSION" ]]
              icon_svg=/tmp/dinx-nocted-icon.svg
              icon_png=/usr/share/icons/hicolor/128x128/apps/com.noctty.NoctEd.png
              tar -xOf \
                "/workspace/distro/packages/noctty/noctty-${NOCTTY_VERSION}.tar.gz" \
                "noctty-${NOCTTY_VERSION}/resources/com.noctty.NoctEd.svg" \
                > "$icon_svg"
              mkdir -p "$(dirname "$icon_png")"
              rsvg-convert -w 128 -h 128 -o "$icon_png" "$icon_svg"
              gtk-update-icon-cache -f /usr/share/icons/hicolor
              rm -f "$icon_svg"
              build_package noctty
              pacman -U --noconfirm "$package_repo"/noctty-*.pkg.tar.zst
              build_package swayimg
              build_package wlroots0.20
              pacman -U --noconfirm "$package_repo"/wlroots0.20-*.pkg.tar.zst
              build_package scenefx
              pacman -U --noconfirm "$package_repo"/scenefx-*.pkg.tar.zst
              build_package mangowm
              GNUPGHOME="$signing_home" repo-add --include-sigs --sign --key "$signing_key" \
                "$package_repo/dinx.db.tar.gz" "$package_repo"/*.pkg.tar.zst
              rm -f "$package_repo/dinx.db" "$package_repo/dinx.db.sig"
              cp -- "$package_repo/dinx.db.tar.gz" "$package_repo/dinx.db"
              cp -- "$package_repo/dinx.db.tar.gz.sig" "$package_repo/dinx.db.sig"
              package_count=$(find "$package_repo" -maxdepth 1 -type f \
                -name "*.pkg.tar.zst" | awk 'END { print NR }')
              package_repository_snapshot=$(
                find "$package_repo" -maxdepth 1 -type f -name "*.pkg.tar.zst" -printf "%f\n" \
                  | LC_ALL=C sort \
                  | while IFS= read -r package_name; do
                      digest=$(sha256sum "$package_repo/$package_name" | cut -d " " -f 1)
                      printf "%s  %s\n" "$digest" "$package_name"
                    done \
                  | LC_ALL=C sort \
                  | sha256sum \
                  | cut -d " " -f 1
              )
              package_repository_db_sha256=$(sha256sum "$package_repo/dinx.db.tar.gz" | cut -d " " -f 1)
              package_repository_key_sha256=$(sha256sum "$package_repo/dinx-package-signing-key.gpg" | cut -d " " -f 1)
              {
                printf "schema=dinx-package-repository/v1\n"
                printf "channel=%s\n" "$package_repository_channel"
                printf "signing_fingerprint=%s\n" "$signing_key"
                printf "package_count=%s\n" "$package_count"
                printf "publication=github-release-assets/v1\n"
                printf "database_sha256=%s\n" "$package_repository_db_sha256"
                printf "key_sha256=%s\n" "$package_repository_key_sha256"
              } > "$package_repo/dinx-repository-metadata.txt"
              scripts/check_dinx_package_repository.sh "$package_repo"
              scripts/smoke_dinx_update.sh "$package_repo"

              pacman_conf=$(find /usr/share/artools -type f \
                -path "*/pacman.conf.d/iso-x86_64.conf" -print -quit)
              test -n "$pacman_conf"
              if ! grep -Eq '^[[:space:]]*\[lib32\][[:space:]]*$' "$pacman_conf"; then
                printf "\n[lib32]\nInclude = /etc/pacman.d/mirrorlist\n" \
                  >> "$pacman_conf"
              fi
              printf "\n[dinx]\nSigLevel = Required\nServer = http://127.0.0.1:8765\n" \
                >> "$pacman_conf"
              builder_pacman_conf_sha256=$(sha256sum "$pacman_conf" | cut -d " " -f 1)
              builder_mirrorlist=/etc/pacman.d/mirrorlist
              test -r "$builder_mirrorlist"
              builder_mirrorlist_sha256=$(sha256sum "$builder_mirrorlist" | cut -d " " -f 1)
              python -m http.server 8765 \
                --bind 127.0.0.1 \
                --directory "$package_repo" \
                >/tmp/dinx-package-repo.log 2>&1 &
              repo_pid=$!
              trap "kill $repo_pid 2>/dev/null || true" EXIT

              scripts/check-iso-host.sh
              scripts/build-iso.sh
              metadata_path="$DINX_ISO_OUTPUT/dinx/build-metadata.txt"
              mkdir -p "$(dirname "$metadata_path")"
              iso_path=$(find "$DINX_ISO_OUTPUT" -type f -name "*.iso" -print -quit)
              test -n "$iso_path"
              iso_size=$(stat -c "%s" "$iso_path")
              iso_sha512=$(sha512sum "$iso_path" | cut -d " " -f 1)
              buildiso_owner=$(pacman -Qo "$(command -v buildiso)")
              package_snapshot=$(pacman -Q iso-profiles mkinitcpio)
              {
                printf "schema=dinx-build-metadata/v1\n"
                printf "repository=%s\n" "$DINX_REPOSITORY"
                printf "commit=%s\n" "$DINX_COMMIT"
                printf "workflow_run=%s\n" "$DINX_RUN_ID"
                printf "artix_image=%s\n" "$DINX_ARTIX_IMAGE"
                printf "builder_pacman_conf_sha256=%s\n" "$builder_pacman_conf_sha256"
                printf "builder_mirrorlist_sha256=%s\n" "$builder_mirrorlist_sha256"
                printf "buildiso_owner=%s\n" "$buildiso_owner"
                printf "zig_version=%s\n" "$(zig version)"
                printf "profile_sha256=%s\n" "$(sha256sum /workspace/distro/iso/iso-profiles/dinx/profile.yaml | cut -d " " -f 1)"
                printf "feature_groups_sha256=%s\n" "$(sha256sum /workspace/distro/iso/iso-profiles/dinx/feature-groups.json | cut -d " " -f 1)"
                printf "package_repository_schema=dinx-package-repository/v1\n"
                printf "package_repository_channel=%s\n" "$package_repository_channel"
                printf "package_repository_publication=github-release-assets/v1\n"
                printf "package_repository_snapshot=%s\n" "$package_repository_snapshot"
                printf "package_repository_signing_fingerprint=%s\n" "$signing_key"
                printf "package_repository_db_sha256=%s\n" "$package_repository_db_sha256"
                printf "package_repository_key_sha256=%s\n" "$package_repository_key_sha256"
                printf "package_signing_mode=%s\n" "$package_signing_mode"
                printf "iso_name=%s\n" "$(basename "$iso_path")"
                printf "iso_bytes=%s\n" "$iso_size"
                printf "iso_sha512=%s\n" "$iso_sha512"
                printf "[builder-packages]\n"
                printf "%s\n" "$package_snapshot"
                printf "[all-artix-packages]\n"
                pacman -Q
              } > "$metadata_path"
          DINX_CONTAINER_SCRIPT
            )"
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/dist/iso" "$GITHUB_WORKSPACE/dist/packages"

      - name: Generate checksum and locate ISO
        id: artifact
        run: |
          iso_path=$(find dist/iso -type f -name '*.iso' -print -quit)
          test -n "$iso_path"
          metadata_path=$(find dist/iso -type f -name 'build-metadata.txt' -print -quit)
          test -n "$metadata_path"
          iso_dir=$(dirname "$iso_path")
          iso_name=$(basename "$iso_path")
          (cd "$iso_dir" && sha512sum "$iso_name" > "$iso_name.sha512")
          printf 'iso_path=%s\n' "$iso_path" >> "$GITHUB_OUTPUT"
          printf 'metadata_path=%s\n' "$metadata_path" >> "$GITHUB_OUTPUT"
          printf 'DINX_ISO=%s\n' "$iso_path" >> "$GITHUB_ENV"
      - name: Verify build metadata
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/check_build_metadata.sh "${{ steps.artifact.outputs.metadata_path }}"
      - name: Verify built ISO and boot-window budgets
        env:
          DINX_ISO_PATH: ${{ env.DINX_ISO }}
          DINX_QEMU_TIMEOUT: 90
        run: ./scripts/check_dinx_budget.sh

      - name: Boot smoke test and graphical capture
        env:
          DINX_QEMU_TIMEOUT: 90
          DINX_QEMU_SCREENSHOT: dist/iso/dinx/dinx-graphical-screen.ppm
          DINX_QEMU_BOOT_SCREENSHOT: dist/iso/dinx/dinx-boot-screen.ppm
          DINX_QEMU_BOOT_SCREENSHOT_DELAY: 3
          DINX_QEMU_SCREENSHOT_DELAY: 60
          DINX_QEMU_BOOT_KEYS: down,down,ret
          DINX_QEMU_POST_SCREENSHOT: dist/iso/dinx/dinx-session-screen.ppm
          DINX_QEMU_POST_SCREENSHOT_DELAY: 10
          DINX_QEMU_POST_KEYS: ret,d,i,n,x,ret
        run: scripts/smoke-iso.sh "$DINX_ISO"

      - name: Verify graphical ISO payload
        run: scripts/check-iso-content.sh "$DINX_ISO"
      - name: Smoke-test persistent BIOS and UEFI installs and recovery TTY
        env:
          DINX_INSTALL_OUTPUT_DIR: dist/iso/dinx
          DINX_INSTALL_TIMEOUT: 180
        run: |
          DINX_INSTALL_FIRMWARE=bios scripts/smoke-install.sh "$DINX_ISO"
          DINX_INSTALL_FIRMWARE=uefi scripts/smoke-install.sh "$DINX_ISO"

      - name: Attest ISO, package repository and checksum provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ steps.artifact.outputs.iso_path }}
            ${{ steps.artifact.outputs.iso_path }}.sha512
            ${{ steps.artifact.outputs.metadata_path }}
            dist/packages/**/*
      - name: Upload alpha workflow artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dinx-foundation-iso-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |

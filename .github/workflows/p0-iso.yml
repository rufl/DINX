name: P0 ISO foundation

on:
# This workflow intentionally does not run on pull requests: the build uses a privileged container.
# Add an isolated validation workflow before enabling any pull-request trigger.
  workflow_dispatch:
  workflow_call:
    inputs:
      require_persistent_package_signing:
        description: Require the production package-signing secret for a published release
        required: false
        type: boolean
        default: false
    secrets:
      DINX_PACKAGE_SIGNING_KEY:
        required: false
      DINX_PACKAGE_SIGNING_FINGERPRINT:
        required: false
      DEETTY_SOURCE_READ_TOKEN:
        required: false
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p0-iso.yml"
      - ".github/workflows/release.yml"
      - "distro/iso/**"
      - "distro/packages/dinx-firewalld-dinit/**"
      - "scripts/build-iso.sh"
      - "scripts/build-iso-docker.sh"
      - "scripts/build-iso-container.sh"
      - "scripts/iso-builder/**"
      - "scripts/cache-verified-download.sh"
      - "scripts/cache-verified-extract.sh"
      - "scripts/smoke_cache_verified_extract.sh"
      - "scripts/lib/dinx-package-artifact-cache.sh"
      - "scripts/smoke_package_artifact_cache.sh"
      - "scripts/iso-tools/mksquashfs"
      - "scripts/iso-tools/prioritize-dinx-pacman-repo.sh"
      - "scripts/check_dinx_compression.sh"
      - "scripts/check_wizp_package.sh"
      - "scripts/check-iso-content.sh"
      - "scripts/initramfs_manifest.py"
      - "scripts/test_initramfs_manifest.py"
      - "scripts/check_dinx_package_repository.sh"
      - "scripts/check_dinx_package_provenance.sh"
      - "scripts/check_dinx_release_preflight.sh"
      - "scripts/smoke_dinx_update.sh"
      - "scripts/check_dinx_feature_groups.sh"
      - "scripts/check_build_metadata.sh"
      - "scripts/smoke_build_metadata.sh"
      - "scripts/check-iso-host.sh"
      - "scripts/check_dinx_theme.sh"
      - "scripts/check_deetty_integration.sh"
      - "scripts/check_ghostty_vt_runtime.sh"
      - "scripts/dintor_p3_qualification.sh"
      - "scripts/deetty_p2_qualification.sh"
      - "scripts/prepare_first_party_apps.sh"
      - "scripts/check_first_party_apps.sh"
      - "scripts/smoke-iso.sh"
      - "scripts/check_dinx_qemu_session.sh"
      - "scripts/check_dinx_contracts.sh"
      - "scripts/check_dinx_plymouth_screen.py"
      - "scripts/test_dinx_plymouth_screen.py"
      - "scripts/smoke-install.sh"
      - "scripts/check_calamares_partitioning.sh"
      - "scripts/qualify-iso.sh"
      - "scripts/check-iso-qualification-host.sh"
      - "scripts/smoke_cache_verified_download.sh"
      - "scripts/check_install_lifecycle.sh"
      - "scripts/smoke_calamares_partitioning.sh"
      - "scripts/smoke_calamares_startup.sh"
      - "scripts/smoke_calamares_windows.sh"
      - "scripts/smoke-iso.ps1"
      - "scripts/package-windows-qemu.sh"
      - "scripts/deploy-ztash.sh"
      - "tools/dinx-qemu-launcher.c"
      - "scripts/check_floorp.sh"
      - "scripts/check_opensnitch.sh"
      - "scripts/check_swayimg.sh"
      - "scripts/check_package_managers.sh"
      - "scripts/check_desktop_packages.sh"
      - "scripts/check_pori_phyto.sh"
      - "scripts/check_seafoam_apps.sh"
      - "scripts/check_seafoam_settings.sh"
      - "scripts/check_aqueous_pearl.sh"
      - "scripts/smoke_zls.sh"
      - "scripts/check_dinx_display_persistence.sh"
      - "scripts/smoke_dinx_display_persistence.sh"
      - "scripts/smoke_dinx_session_supervisor.sh"
      - "scripts/smoke_pori_mount_service.sh"
      - "scripts/smoke_pori_zig.sh"
      - "scripts/check_firewall_tools.sh"
      - "scripts/check_cyan_skillfish.sh"
      - "scripts/check_bc250_control_center.sh"
      - "scripts/check_dinitui.sh"
      - "scripts/check_dinxpanel.sh"
      - "scripts/check_dinx_live_autologin.sh"
      - "scripts/check_dinx_session.sh"
      - "scripts/smoke_dinx_theme_sync.sh"
      - "scripts/check_dinx_doctor.sh"
      - "scripts/smoke_dinx_doctor.sh"
      - "scripts/check_dinx_budget.sh"
      - "scripts/measure_dinx_session.sh"
      - "scripts/smoke_dinx_session.sh"
      - "scripts/check_alpha7_hardware_report.sh"
      - "scripts/check_dinx_hardware_evidence.sh"
      - "scripts/dinitui_dinit_qualification.sh"
      - "scripts/gaming_p5_qualification.sh"
      - "LICENSE"

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: p0-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build and smoke-test DINX foundation ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout DINX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute reusable build-cache input digest
        id: cache-inputs
        run: |
          cache_input_hash=$(
            git ls-files -z -- distro/packages scripts/build-iso-container.sh \
              scripts/cache-verified-download.sh scripts/cache-verified-extract.sh \
              scripts/lib/dinx-package-artifact-cache.sh scripts/iso-builder \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | cut -d ' ' -f 1
          )
          [[ "$cache_input_hash" =~ ^[0-9a-f]{64}$ ]]
          printf 'recipe_sha256=%s\n' "$cache_input_hash" >> "$GITHUB_OUTPUT"
      - name: Prepare reusable DINX build caches
        run: mkdir -p dist/.cache/dinx/{package-artifacts,makepkg-sources,cargo,cargo-target,zig,toolchains}
      - name: Restore verified DINX package artifacts
        id: package-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: dist/.cache/dinx/package-artifacts
          key: dinx-package-artifacts-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.recipe_sha256 }}
          restore-keys: |
            dinx-package-artifacts-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore makepkg, Cargo and Zig build caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: |
            dist/.cache/dinx/makepkg-sources
            dist/.cache/dinx/cargo
            dist/.cache/dinx/cargo-target
            dist/.cache/dinx/zig
          key: dinx-build-data-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.recipe_sha256 }}
          restore-keys: |
            dinx-build-data-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore verified Zig toolchains
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: dist/.cache/dinx/toolchains
          key: dinx-toolchains-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.recipe_sha256 }}
          restore-keys: |
            dinx-toolchains-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Read pinned Deetty/Dintor source revision
        id: deetty-source
        run: |
          ref=$(awk -F= '$1 == "DEETTY_REF" { print $2; exit }' distro/packages/deetty/source.env)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { printf 'Invalid DEETTY_REF in source.env\n' >&2; exit 1; }
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Deetty source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rufl/DEETTY
          ref: ${{ steps.deetty-source.outputs.ref }}
          token: ${{ secrets.DEETTY_SOURCE_READ_TOKEN || github.token }}
          path: third_party/deetty
          persist-credentials: false
      - name: Prepare pinned Deetty/Dintor source archive
        run: ./scripts/prepare_first_party_apps.sh third_party/deetty
      - name: Verify pinned Deetty source archive
        run: ./scripts/check_first_party_apps.sh
      - name: Verify Deetty and Dintor desktop and shell integration
        run: ./scripts/check_deetty_integration.sh
      - name: Verify VT-only runtime packaging and sole-terminal build order
        run: ./scripts/check_ghostty_vt_runtime.sh
      - name: Verify Floorp defaults and managed browser policy
        run: ./scripts/check_floorp.sh
      - name: Verify OpenSnitch Dinit service and live UI autostart
        run: ./scripts/check_opensnitch.sh

      - name: Verify pinned swayimg source and package contract
        run: ./scripts/check_swayimg.sh
      - name: Verify pinned package-management sources and payload contract
        run: ./scripts/check_package_managers.sh
      - name: Verify scanner, firmware, Flatpak and image-editor payload
        run: ./scripts/check_desktop_packages.sh
      - name: Verify Pori, Phyto, dinit storage and NTFS contracts
        run: ./scripts/check_pori_phyto.sh
      - name: Verify Seafoam app selection and Dome package contract
        run: ./scripts/check_seafoam_apps.sh
      - name: Verify Seafoam Settings package and argv contract
        run: ./scripts/check_seafoam_settings.sh

      - name: Install pinned Zig for native session contracts
        env:
          DINX_CACHE_DIRTY_MARKER: ${{ github.workspace }}/dist/.cache/dinx/toolchains/.dinx-toolchain-cache-updated-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          zig_version=0.17.0
          zig_archive="zig-x86_64-linux-${zig_version}.tar.xz"
          zig_sha256=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
          zig_archive_path="$GITHUB_WORKSPACE/dist/.cache/dinx/toolchains/$zig_archive"
          scripts/cache-verified-download.sh \
            "$zig_archive_path" \
            "https://ziglang.org/download/${zig_version}/${zig_archive}" \
            "$zig_sha256"
          zig_root="$GITHUB_WORKSPACE/dist/.cache/dinx/toolchains/extracted/zig-${zig_version}-${zig_sha256}"
          scripts/cache-verified-extract.sh \
            "$zig_archive_path" "$zig_sha256" "$zig_version" zig "$zig_root"
          echo "$zig_root" >> "$GITHUB_PATH"
      - name: Verify Aqueous/Pearl direct dinit session contract
        run: ./scripts/check_aqueous_pearl.sh
      - name: Verify wdisplays to Shikane persistence contract
        run: ./scripts/check_dinx_display_persistence.sh
      - name: Smoke-test wdisplays to Shikane persistence
        run: ./scripts/smoke_dinx_display_persistence.sh
      - name: Smoke-test the sole Aqueous/Pearl session boundary
        run: ./scripts/smoke_dinx_session_supervisor.sh
      - name: Smoke-test supervised Pori NTFS mount service
        run: ./scripts/smoke_pori_mount_service.sh
      - name: Verify WIZP package staging and desktop contract
        run: ./scripts/check_wizp_package.sh
      - name: Verify DINX package provenance policy
        run: scripts/check_dinx_package_provenance.sh
      - name: Smoke-test verified package-artifact cache
        run: ./scripts/smoke_package_artifact_cache.sh
      - name: Smoke-test verified toolchain extraction cache
        run: ./scripts/smoke_cache_verified_extract.sh
      - name: Verify DINX feature-group coverage
        run: scripts/check_dinx_feature_groups.sh
      - name: Verify Cyan Skillfish and BC-250 support contract
        run: ./scripts/check_cyan_skillfish.sh
      - name: Verify BC250 Control Center package and session contract
        run: ./scripts/check_bc250_control_center.sh
      - name: Verify firewall and process-monitoring payload contract
        run: ./scripts/check_firewall_tools.sh
      - name: Verify DinitUI package and privilege contract
        run: ./scripts/check_dinitui.sh
      - name: Verify DINXPanel control-center and kernel contract
        run: ./scripts/check_dinxpanel.sh
      - name: Verify DINX lock, idle, brightness and launcher hierarchy contract
        run: ./scripts/check_dinx_session.sh
      - name: Verify live-session autologin boundary
        run: ./scripts/check_dinx_live_autologin.sh
      - name: Verify read-only DINX doctor contract
        run: ./scripts/check_dinx_doctor.sh
      - name: Smoke-test read-only DINX doctor
        run: ./scripts/smoke_dinx_doctor.sh
      - name: Verify installer lifecycle boundary
        run: ./scripts/check_install_lifecycle.sh
      - name: Verify Calamares partitioning contract
        run: ./scripts/check_calamares_partitioning.sh
      - name: Verify deterministic ISO compression contract
        run: ./scripts/check_dinx_compression.sh
      - name: Verify DINX payload and startup budgets
        run: ./scripts/check_dinx_budget.sh
      - name: Capture host session measurement context
        run: ./scripts/measure_dinx_session.sh
      - name: Smoke-test DINX lock and idle argv
        run: ./scripts/smoke_dinx_session.sh
      - name: Verify gaming session and 32-bit graphics contract
        run: ./scripts/check_gaming.sh
      - name: Verify Alpha 7 hardware-report contract
        run: ./scripts/check_alpha7_hardware_report.sh

      - name: Verify Artix initramfs patch contract
        run: ./scripts/check_artix_initcpio_patch.sh
      - name: Install QEMU and ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-daemon dconf-cli dconf-service btrfs-progs dosfstools libarchive-tools ntfs-3g grub-efi-amd64-bin ovmf qemu-system-x86 qemu-utils squashfs-tools xorriso zstd socat grub-pc-bin tesseract-ocr tesseract-ocr-eng
      - name: Smoke-test GTK and Qt theme synchronization
        run: ./scripts/smoke_dinx_theme_sync.sh
      - name: Verify full ISO qualification prerequisites
        run: scripts/check-iso-qualification-host.sh full --build-path "$GITHUB_WORKSPACE/dist" --build-path "$RUNNER_TEMP" --build-path "$(docker info --format '{{.DockerRootDir}}')"
      - name: Smoke-test Calamares partition transaction
        run: sudo ./scripts/smoke_calamares_partitioning.sh
      - name: Smoke-test Windows side-by-side and manual partition transactions
        run: sudo ./scripts/smoke_calamares_windows.sh

      - name: Prepare pinned builder image identity
        id: builder-image
        run: |
          printf 'refresh_date=%s\n' "$(date -u +%F)" >> "$GITHUB_OUTPUT"
          recipe_sha256=$(sha256sum scripts/iso-builder/Dockerfile scripts/iso-builder/packages.txt | sha256sum | cut -d ' ' -f 1)
          printf 'recipe_sha256=%s\n' "$recipe_sha256" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build and cache Artix builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./scripts/iso-builder
          file: ./scripts/iso-builder/Dockerfile
          tags: dinx-iso-builder:ci
          load: true
          build-args: |
            DINX_ARTIX_IMAGE=artixlinux/artixlinux@sha256:e746e31ffe48f9526759711de0a3bc4cb7a8f61d7339dc9b11fe6bee4a722507
            DINX_BUILDER_REFRESH=${{ steps.builder-image.outputs.refresh_date }}
            DINX_BUILDER_RECIPE_SHA256=${{ steps.builder-image.outputs.recipe_sha256 }}
          cache-from: type=gha,scope=dinx-iso-builder
          cache-to: type=gha,scope=dinx-iso-builder,mode=max
      - name: Build with Artix artools
        id: iso-build
        env:
          DINX_BUILDER_IMAGE: dinx-iso-builder:ci
          DINX_BUILDER_PREBUILT: 'true'
          DINX_BUILDER_REFRESH_DATE: ${{ steps.builder-image.outputs.refresh_date }}
          DINX_PACKAGE_SIGNING_KEY: ${{ inputs.require_persistent_package_signing && secrets.DINX_PACKAGE_SIGNING_KEY || '' }}
          DINX_PACKAGE_SIGNING_FINGERPRINT: ${{ inputs.require_persistent_package_signing && secrets.DINX_PACKAGE_SIGNING_FINGERPRINT || '' }}
          DINX_REQUIRE_PERSISTENT_PACKAGE_SIGNING: ${{ inputs.require_persistent_package_signing }}
          DINX_ARTIX_IMAGE: artixlinux/artixlinux@sha256:e746e31ffe48f9526759711de0a3bc4cb7a8f61d7339dc9b11fe6bee4a722507
          DINX_BUILD_CONTEXT: github-actions
          DINX_SKIP_CONTRACTS: 'true'
          DINX_SKIP_POSTBUILD_CHECKS: 'true'
          DINX_BUILD_CACHE_DIR: ${{ github.workspace }}/dist/.cache/dinx
          DINX_BUILDER_RECIPE_SHA256: ${{ steps.builder-image.outputs.recipe_sha256 }}
        run: scripts/build-iso-docker.sh
      - name: Detect changed build caches
        id: cache-dirty
        if: always()
        run: |
          package_marker="dist/.cache/dinx/package-artifacts/.dinx-package-cache-updated-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          data_marker="dist/.cache/dinx/.dinx-build-data-updated-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          toolchain_marker="dist/.cache/dinx/toolchains/.dinx-toolchain-cache-updated-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          package_dirty=false
          data_dirty=false
          toolchains_dirty=false
          [[ ! -f "$package_marker" ]] || package_dirty=true
          [[ ! -f "$data_marker" ]] || data_dirty=true
          [[ ! -f "$toolchain_marker" ]] || toolchains_dirty=true
          printf 'package_artifacts=%s\n' "$package_dirty" >> "$GITHUB_OUTPUT"
          printf 'build_data=%s\n' "$data_dirty" >> "$GITHUB_OUTPUT"
          printf 'toolchains=%s\n' "$toolchains_dirty" >> "$GITHUB_OUTPUT"
          if [[ -d dist/.cache/dinx ]]; then
            find dist/.cache/dinx -maxdepth 2 -type f \
              \( -name '.dinx-package-cache-updated-*' -o -name '.dinx-build-data-updated-*' \
                -o -name '.dinx-toolchain-cache-updated-*' \) \
              -delete
          fi
      - name: Save verified DINX package artifacts
        if: always() && steps.iso-build.outcome != 'skipped' && steps.cache-dirty.outputs.package_artifacts == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: dist/.cache/dinx/package-artifacts
          key: dinx-package-artifacts-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.recipe_sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save makepkg, Cargo and Zig build caches
        if: always() && steps.iso-build.outcome != 'skipped' && steps.cache-dirty.outputs.build_data == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: |
            dist/.cache/dinx/makepkg-sources
            dist/.cache/dinx/cargo
            dist/.cache/dinx/cargo-target
            dist/.cache/dinx/zig
          key: dinx-build-data-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.recipe_sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save verified Zig toolchains
        if: always() && steps.iso-build.outcome != 'skipped' && steps.cache-dirty.outputs.toolchains == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: dist/.cache/dinx/toolchains
          key: dinx-toolchains-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.recipe_sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Generate checksum and locate ISO
        id: artifact
        run: |
          mapfile -t iso_paths < <(find dist/iso -type f -name '*.iso' -print | LC_ALL=C sort)
          test "${#iso_paths[@]}" -eq 1 || { printf 'Expected exactly one ISO, found %s\n' "${#iso_paths[@]}" >&2; exit 1; }
          iso_path=${iso_paths[0]}
          metadata_path="$(dirname "$iso_path")/build-metadata.txt"
          mapfile -t metadata_paths < <(find dist/iso -type f -name build-metadata.txt -print | LC_ALL=C sort)
          test "${#metadata_paths[@]}" -eq 1 && test "${metadata_paths[0]}" = "$metadata_path" \
            || { printf 'Expected exactly one build metadata file adjacent to the ISO\n' >&2; exit 1; }
          test -s "$metadata_path"
          iso_dir=$(dirname "$iso_path")
          iso_name=$(basename "$iso_path")
          (cd "$iso_dir" && sha512sum "$iso_name" > "$iso_name.sha512")
          printf 'iso_path=%s\n' "$iso_path" >> "$GITHUB_OUTPUT"
          printf 'iso_dir=%s\n' "$iso_dir" >> "$GITHUB_OUTPUT"
          printf 'metadata_path=%s\n' "$metadata_path" >> "$GITHUB_OUTPUT"
          printf 'DINX_ISO=%s\n' "$iso_path" >> "$GITHUB_ENV"
      - name: Bundle signed package repository for artifact portability
        run: |
          set -euo pipefail
          test -d dist/packages
          tar --format=posix --owner=0 --group=0 --numeric-owner \
            --directory dist \
            --create \
            --file dist/dinx-package-repository.tar \
            packages
          test -s dist/dinx-package-repository.tar

      - name: Qualify built ISO with shared local/CI gates
        env:
          DINX_EXPECTED_COMMIT: ${{ github.sha }}
          DINX_QEMU_TIMEOUT: 120
          DINX_INSTALL_TIMEOUT: 180
        run: scripts/qualify-iso.sh "$DINX_ISO"

      - name: Attest ISO, package repository and checksum provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ steps.artifact.outputs.iso_path }}
            ${{ steps.artifact.outputs.iso_path }}.sha512
            ${{ steps.artifact.outputs.metadata_path }}
            dist/dinx-package-repository.tar
      - name: Upload P0 qualification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dinx-p0-${{ job.status }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ steps.artifact.outputs.iso_path }}
            ${{ steps.artifact.outputs.iso_path }}.sha512
            ${{ steps.artifact.outputs.metadata_path }}
            dist/iso/dinx/*.qemu.log
            dist/iso/dinx/*.ppm
            dist/dinx-package-repository.tar
            dist/dinx-build.log

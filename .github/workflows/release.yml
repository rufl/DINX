name: DINX release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published prerelease tag to seed or resync the rolling ISO alias
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    if: github.event_name == 'push'
    name: Build and smoke-test release ISO
    uses: ./.github/workflows/p0-iso.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      require_persistent_package_signing: true
    secrets: inherit

  publish:
    name: Publish DINX alpha release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout DINX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download ISO build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dinx-foundation-iso-${{ github.sha }}
          path: dist/release-input

      - name: Install pinned Zig cross compiler
        run: |
          set -euo pipefail
          zig_version=0.17.0
          zig_archive="zig-x86_64-linux-${zig_version}.tar.xz"
          zig_sha256=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/$zig_archive" \
            "https://ziglang.org/download/${zig_version}/${zig_archive}"
          printf '%s  %s\n' "$zig_sha256" "$RUNNER_TEMP/$zig_archive" \
            | sha256sum --check --status -
          tar -xJf "$RUNNER_TEMP/$zig_archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-${zig_version}" >> "$GITHUB_PATH"
      - name: Install repository preflight tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnupg libarchive-tools

      - name: Unpack signed package repository artifact
        run: |
          set -euo pipefail
          repository_archive=$(find dist/release-input -type f \
            -name 'dinx-package-repository.tar' -print -quit)
          test -n "$repository_archive"
          tar -xf "$repository_archive" -C dist/release-input
          test -f dist/release-input/packages/dinx.db.tar.gz

      - name: Assemble release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9._-]+$ ]]
          input_iso=$(find dist/release-input -type f -name '*.iso' -print -quit)
          input_metadata=$(find dist/release-input -type f -name 'build-metadata.txt' -print -quit)
          test -n "$input_metadata"
          test -n "$input_iso"
          mkdir -p dist/release
          iso_name="dinx-${version}-x86_64.iso"
          iso_sha512=$(sha512sum "$input_iso" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$iso_sha512" "$iso_name" > "dist/release/$iso_name.sha512"
          release_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          input_repository_db=$(find dist/release-input -type f -name 'dinx.db.tar.gz' -print -quit)
          test -n "$input_repository_db"
          input_repository_dir=$(dirname "$input_repository_db")
          repository_dir=dist/release/repository
          repository_asset_manifest=dist/release/repository-assets.list
          mkdir -p "$repository_dir"
          repository_assets=()
          : > "$repository_asset_manifest"
          while IFS= read -r -d '' source_asset; do
            asset_name=$(basename "$source_asset")
            cp -- "$source_asset" "$repository_dir/$asset_name"
            release_asset="dist/release/$asset_name"
            cp -- "$source_asset" "$release_asset"
            repository_assets+=("$release_asset")
            printf '%s\n' "$release_asset" >> "$repository_asset_manifest"
          done < <(find "$input_repository_dir" -maxdepth 1 -type f -print0 | sort -z)
          (( ${#repository_assets[@]} > 0 ))
          scripts/check_dinx_release_preflight.sh \
            "$input_metadata" "$repository_dir" "$RELEASE_TAG" "$release_base_url" "$input_iso"
          repository_snapshot=$(awk -F= '$1 == "snapshot" { print $2; exit }' \
            "$repository_dir/dinx-repository-metadata.txt")
          repository_fingerprint=$(awk -F= '$1 == "signing_fingerprint" { print $2; exit }' \
            "$repository_dir/dinx-repository-metadata.txt")
          rm -rf "$repository_dir"
          iso_size=$(wc -c < "$input_iso")
          iso_parts_manifest=""
          iso_source_metadata=""
          if (( iso_size >= 2147483648 )); then
            command -v jq >/dev/null 2>&1
            iso_part_prefix="dist/release/${iso_name}.part-"
            split --bytes=1900M --numeric-suffixes=0 --suffix-length=2 \
              "$input_iso" "$iso_part_prefix"
            iso_parts_manifest_name="${iso_name}.parts.json"
            iso_parts_manifest="dist/release/$iso_parts_manifest_name"
            parts_json='[]'
            while IFS= read -r -d '' part; do
              part_name=$(basename "$part")
              part_url="$release_base_url/$part_name"
              part_sha512=$(sha512sum "$part" | cut -d ' ' -f 1)
              part_size=$(wc -c < "$part")
              parts_json=$(jq -c \
                --arg file "$part_name" \
                --arg url "$part_url" \
                --arg sha512 "$part_sha512" \
                --argjson size "$part_size" \
                '. + [{file: $file, url: $url, sha512: $sha512, size: $size}]' \
                <<<"$parts_json")
            done < <(find dist/release -maxdepth 1 -type f -name "${iso_name}.part-*" -print0 | sort -z)
            jq -n \
              --arg application "dinx" \
              --arg build_id "$GITHUB_SHA" \
              --arg file "dinx-${version}-dogfood.1.iso" \
              --arg sha512 "$iso_sha512" \
              --arg url "$release_base_url/$iso_parts_manifest_name" \
              --argjson size "$iso_size" \
              --argjson parts "$parts_json" \
              '{
                application: $application,
                build_id: $build_id,
                file: $file,
                parts: $parts,
                schema: "dinx.iso-parts/v1",
                sha512: $sha512,
                size: $size,
                url: $url
              }' > "$iso_parts_manifest"
            iso_source_metadata="$iso_parts_manifest"
            iso_delivery_note="The ISO exceeds GitHub's 2 GiB release-asset limit. Download all \`${iso_name}.part-*\` assets in lexical order, concatenate them, and verify \`${iso_name}.sha512\`; the Windows launcher assembles the parts automatically."
          else
            cp "$input_iso" "dist/release/$iso_name"
            iso_delivery_note="The ISO is published as \`${iso_name}\` with its matching SHA-512 file."
          fi
          package_args=(
            "$release_base_url"
            "${version}-dogfood.1"
            "$release_base_url/$iso_name"
            "$iso_sha512"
            "$GITHUB_SHA"
            dist/release
          )
          if [[ -n "$iso_source_metadata" ]]; then
            package_args+=("$iso_source_metadata")
          fi
          scripts/package-windows-qemu.sh "${package_args[@]}"
          release_evidence=()
          while IFS= read -r evidence; do
            if [[ ! -s "$evidence" ]]; then
              printf 'Skipping empty release evidence: %s\n' "$evidence"
              continue
            fi
            evidence_asset="dist/release/dinx-${version}-$(basename "$evidence")"
            cp "$evidence" "$evidence_asset"
            release_evidence+=("$evidence_asset")
          done < <(find dist/release-input -type f \( -name '*.ppm' -o -name '*.qemu.log' \) -print)
          package_name="dinx-${version}-dogfood.1-windows-x86_64.zip"
          windows_metadata_name="dinx-${version}-dogfood.1-windows-x86_64.json"
          manifest_name="dinx-${version}-dogfood.1-deployment-manifest.json"
          build_metadata_name="dinx-${version}-build-metadata.txt"
          cp "$input_metadata" "dist/release/$build_metadata_name"
          checksum_targets=(
            "dist/release/$iso_name.sha512"
            "dist/release/$package_name"
            "dist/release/$windows_metadata_name"
            "dist/release/$build_metadata_name"
            "dist/release/$manifest_name"
          )
          for repository_asset in "${repository_assets[@]}"; do
            checksum_targets+=("$repository_asset")
          done
          if [[ -n "$iso_parts_manifest" ]]; then
            checksum_targets+=("$iso_parts_manifest")
            while IFS= read -r -d '' part; do
              checksum_targets+=("$part")
            done < <(find dist/release -maxdepth 1 -type f -name "${iso_name}.part-*" -print0 | sort -z)
          else
            checksum_targets=("dist/release/$iso_name" "${checksum_targets[@]}")
          fi
          sha256sum "${checksum_targets[@]}" > dist/release/SHA256SUMS
          cat > dist/release/RELEASE_NOTES.md <<EOF
          # DINX ${RELEASE_TAG}

          Public alpha live-validation ISO for x86_64 Artix Linux with dinit.

          ## Verification

          - SHA-512: \`${iso_name}.sha512\`
          - Linux QEMU boot, graphical payload, boot-menu and automated live-session captures passed in CI.
          - The persistent-install smoke copied the Calamares rootfs contract to disposable BIOS and UEFI disks, booted dinit and captured a recovery TTY frame.
          - GitHub artifact attestations cover the ISO or its parts, checksums, Windows package and release metadata. Verify with \`gh attestation verify <file> -R rufl/DINX\`.
          - \`${build_metadata_name}\` records the source commit, builder image, package snapshot and ISO digest.
          ## Signed DINX pacman repository

          The release publishes the custom DINX packages at \`${release_base_url}\`.
          Artix repositories remain configured separately. The repository snapshot is
          \`${repository_snapshot}\`; its signing fingerprint is
          \`${repository_fingerprint}\`.

          Install the public key before enabling the repository:

          \`\`\`bash
          curl --fail --location \
            '${release_base_url}/dinx-package-signing-key.gpg' \
            --output /tmp/dinx-package-signing-key.gpg
          pacman-key --add /tmp/dinx-package-signing-key.gpg
          pacman-key --lsign-key ${repository_fingerprint}
          \`\`\`

          Add this block to \`/etc/pacman.conf\`:

          \`\`\`ini
          [dinx]
          SigLevel = Required
          Server = ${release_base_url}
          \`\`\`

          Refresh and update with \`pacman -Syu\`. CI verifies a signed install,
          update and package downgrade transaction using the same pacman signature
          requirements. A full installed-ISO upgrade, filesystem rollback and
          physical recovery procedure remain unsupported.

          ## ISO delivery

          ${iso_delivery_note}

          ## Windows QEMU package

          \`${package_name}\` is a small launcher package. It downloads the URL
          pinned in \`dinx-iso.json\`, downloads and verifies each ISO part when required,
          assembles the ISO, verifies the full SHA-512, requires
          \`qemu-system-x86_64.exe\`, and captures the boot-menu and post-autologin session
          frames in a desktop Windows session. It does not install QEMU or a Windows
          service.

          The package metadata and deployment manifest target the registered ZTASH
          receiver \`ddjarin\`. Run \`scripts/deploy-ztash.sh ${RELEASE_TAG}\` from a
          trusted owner machine for a preview; add \`--apply\` only after review.

          This release includes the experimental offline Calamares installer and GParted.
          The installer contract is qualified in CI on disposable BIOS and UEFI disks, but physical hardware
          installation, installed-ISO upgrades, filesystem rollback and data preservation remain unsupported;
          verify the target device and read the installation guide before using either destructive tool.
          The live session automatically opens the disposable `dinx` account in Aqueous + Pearl; no username or password is requested. Installed/manual login uses Pearl Greeter through greetd with the dedicated `pearl-greeter` account; it forces `Aqueous + Pearl (DINX)` and ships no systemd/UWSM integration. If the live session exits, greetd returns to Pearl Greeter instead of switching sessions silently. Use the disposable password `dinx` only for diagnosis when starting the live session manually; never reuse it.
          EOF
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/release/*.iso
            dist/release/*.iso.sha512
            dist/release/*.iso.part-*
            dist/release/*.iso.parts.json
            dist/release/*windows-x86_64.zip
            dist/release/*windows-x86_64.json
            dist/release/*deployment-manifest.json
            dist/release/SHA256SUMS
            dist/release/*-build-metadata.txt
            dist/release/*.pkg.tar.*
            dist/release/dinx.db*
            dist/release/dinx.files*
            dist/release/dinx-package-signing-key.gpg
            dist/release/dinx-repository-metadata.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          case "$version" in
            *-alpha*|*-beta*|*-rc*) prerelease=(--prerelease) ;;
            *) prerelease=() ;;
          esac
          release_assets=()
          while IFS= read -r -d '' source_asset; do
            release_assets+=("$source_asset")
          done < <(find dist/release -maxdepth 1 -type f -name "dinx-${version}-x86_64.iso*" -print0 | sort -z)
          while IFS= read -r source_asset; do
            [[ -n "$source_asset" ]] || continue
            release_assets+=("$source_asset")
          done < dist/release/repository-assets.list
          release_assets+=(
            "dist/release/dinx-${version}-dogfood.1-windows-x86_64.zip"
            "dist/release/dinx-${version}-dogfood.1-windows-x86_64.json"
            "dist/release/dinx-${version}-dogfood.1-deployment-manifest.json"
            dist/release/SHA256SUMS
            "dist/release/dinx-${version}-build-metadata.txt"
          )
          while IFS= read -r -d '' evidence; do
            release_assets+=("$evidence")
          done < <(find dist/release -maxdepth 1 -type f \( -name "dinx-${version}-*.ppm" -o -name "dinx-${version}-*.qemu.log" \) -print0 | sort -z)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DINX ${RELEASE_TAG}" \
              --notes-file dist/release/RELEASE_NOTES.md \
              "${prerelease[@]}"
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "${release_assets[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DINX ${RELEASE_TAG}" \
              --notes-file dist/release/RELEASE_NOTES.md \
              "${prerelease[@]}" \
              "${release_assets[@]}"
          fi
  latest-alpha:
    name: Update rolling alpha ISO alias
    if: always() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success')
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Publish latest alpha ISO alias
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9._-]+$ ]]
          latest_alpha_tag=$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -s -r '
                flatten
                | map(select(
                    .prerelease
                    and (.draft | not)
                    and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-"))
                  ))
                | sort_by(.published_at)
                | last
                | .tag_name // empty
              '
          )
          if [[ "$latest_alpha_tag" != "$RELEASE_TAG" ]]; then
            echo "Skipping stale alpha $RELEASE_TAG; latest published alpha is $latest_alpha_tag."
            exit 0
          fi

          version="${RELEASE_TAG#v}"
          versioned_iso="dinx-${version}-x86_64.iso"
          alias_iso="dinx-latest-x86_64.iso"
          alias_tag=alpha-latest
          release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")
          jq -e '.prerelease == true' <<<"$release_json" >/dev/null
          asset_count=$(jq --arg name "$versioned_iso" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")
          [[ "$asset_count" == 1 ]] || {
            echo "Latest alpha has no single-file ISO asset; use its versioned release assets."
            exit 1
          }
          asset_size=$(jq -r --arg name "$versioned_iso" '.assets[] | select(.name == $name) | .size' <<<"$release_json")
          (( asset_size < 2147483648 )) || {
            echo "Latest alpha ISO exceeds GitHub's 2 GiB per-asset limit."
            exit 1
          }

          alias_dir="$RUNNER_TEMP/dinx-latest-alpha"
          mkdir -p "$alias_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$versioned_iso" \
            --dir "$alias_dir"
          cp "$alias_dir/$versioned_iso" "$alias_dir/$alias_iso"
          iso_sha512=$(sha512sum "$alias_dir/$alias_iso" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$iso_sha512" "$alias_iso" > "$alias_dir/$alias_iso.sha512"

          commit_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)
          alias_ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${alias_tag}"
          if gh api "$alias_ref" >/dev/null 2>&1; then
            gh api --method PATCH "$alias_ref" \
              --field "sha=$commit_sha" \
              --field force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              --field "ref=refs/tags/${alias_tag}" \
              --field "sha=$commit_sha" >/dev/null
          fi

          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          cat > "$alias_dir/notes.md" <<EOF
          # DINX latest alpha ISO

          Rolling direct-download alias for [${RELEASE_TAG}](${release_url}).

          - ISO: \`${alias_iso}\`
          - SHA-512: \`${iso_sha512}\`
          EOF
          if gh release view "$alias_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$alias_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DINX latest alpha ISO" \
              --notes-file "$alias_dir/notes.md" \
              --prerelease
          else
            gh release create "$alias_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$commit_sha" \
              --title "DINX latest alpha ISO" \
              --notes-file "$alias_dir/notes.md" \
              --prerelease
          fi
          gh release upload "$alias_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "$alias_dir/$alias_iso" \
            "$alias_dir/$alias_iso.sha512"

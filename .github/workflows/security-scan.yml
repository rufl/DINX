name: Dependency and source vulnerability scan

on:
  push:
    branches:
      - main
    paths:
      - "distro/packages/**"
      - "distro/iso/**"
      - "scripts/**"
      - "scripts/iso-builder/**"
      - ".github/package-updates.json"
      - "Cargo.lock"
      - "Cargo.toml"
      - "go.mod"
      - "go.sum"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - ".github/workflows/security-scan.yml"
  pull_request:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: dinx-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan source dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout DINX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate source SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dinx-source-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Scan source SBOM with Grype
        id: grype
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: dinx-source-sbom.spdx.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: dinx-grype.sarif
          cache-db: true
      - name: Scan source tree with Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: dinx-trivy.sarif
          exit-code: "1"
      - name: Scan source tree with OSV-Scanner
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --recursive
            --format
            sarif
            --output-file
            osv-results.sarif
            ./
      - name: Upload Grype SARIF
        if: always() && hashFiles('dinx-grype.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: dinx-grype.sarif
      - name: Upload Trivy SARIF
        if: always() && hashFiles('dinx-trivy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: dinx-trivy.sarif
      - name: Upload OSV SARIF
        if: always() && hashFiles('osv-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: osv-results.sarif
      - name: Enforce vulnerability gate
        if: always()
        run: |
          set -euo pipefail
          [[ "${{ steps.grype.outcome }}" == success ]] || exit 1
          [[ "${{ steps.trivy.outcome }}" == success ]] || exit 1
          [[ "${{ steps.osv.outcome }}" == success ]] || exit 1
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dinx-security-reports-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            dinx-source-sbom.spdx.json
            dinx-grype.sarif
            dinx-trivy.sarif
            osv-results.sarif

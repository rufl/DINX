  <text x="40" y="1032" fill="#D7DDE8" font-family="Noto Sans, sans-serif" font-size="14" font-weight="700">Referência visual: 3:1 para contraste gráfico; os pares exibidos passam nos dois fundos do respectivo tema.</text>
  <text x="40" y="1058" fill="#7F8A9C" font-family="Noto Sans, sans-serif" font-size="13">Os tons claros não foram aprovados para superfícies claras. O coral #F4515B passa em #FFFFFF (3.40:1), mas cai para 2.84:1 em #E7EBF1.</text>

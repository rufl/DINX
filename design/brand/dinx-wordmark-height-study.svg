<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="780" viewBox="0 0 1480 780" role="img" aria-labelledby="title desc">
  <title id="title">DINX — comparação da altura do D e do X</title>
  <desc id="desc">A wordmark compacta atual comparada com uma alternativa em que o X tem a mesma altura visual do D.</desc>
  <defs>
    <g id="mark-current" fill="none" stroke="#F4515B" stroke-width="29" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100 242 C100 188 101 120 102 66 C150 76 201 107 234 145 C260 174 261 197 239 218 C211 245 153 263 101 272"/>
      <path d="M294 145 L294 242"/>
      <path d="M342 272 C343 202 343 132 342 66 C379 101 420 174 457 272 C456 202 456 132 457 66"/>
      <path d="M500 96 C535 145 571 196 606 248"/>
      <path d="M606 96 C571 145 535 196 500 248"/>
      <circle cx="294" cy="83" r="17" fill="#F4515B" stroke="none"/>
    </g>
    <g id="mark-equal-height" fill="none" stroke="#F4515B" stroke-width="29" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100 242 C100 188 101 120 102 66 C150 76 201 107 234 145 C260 174 261 197 239 218 C211 245 153 263 101 272"/>
      <path d="M294 145 L294 242"/>
      <path d="M342 272 C343 202 343 132 342 66 C379 101 420 174 457 272 C456 202 456 132 457 66"/>
      <path d="M500 66 C535 136 571 206 606 272"/>
      <path d="M606 66 C571 136 535 206 500 272"/>
      <circle cx="294" cy="83" r="17" fill="#F4515B" stroke="none"/>
    </g>
  </defs>
  <rect width="1480" height="780" fill="#11151D"/>
  <text x="40" y="62" fill="#F6F7F9" font-family="Noto Sans, sans-serif" font-size="34" font-weight="700">DINX · proporção D/X</text>
  <text x="42" y="96" fill="#AAB4C3" font-family="Noto Sans, sans-serif" font-size="17">Comparação visual; a logo principal permanece intacta enquanto avaliamos a alternativa.</text>
  <g font-family="Noto Sans, sans-serif">
    <g transform="translate(40 135)">
      <rect width="680" height="570" rx="18" fill="#E7EBF1"/>
      <text x="24" y="42" fill="#11151D" font-size="22" font-weight="700">ATUAL · X MAIS BAIXO</text>
      <text x="24" y="68" fill="#515D6C" font-size="15">D: 235 u · X: 181 u</text>
      <rect x="20" y="92" width="640" height="180" rx="12" fill="#FFFFFF"/>
      <use href="#mark-current" transform="translate(70 54) scale(0.75)"/>
      <rect x="20" y="286" width="640" height="180" rx="12" fill="#0B0D12"/>
      <use href="#mark-current" transform="translate(70 248) scale(0.75)"/>
      <text x="24" y="506" fill="#11151D" font-size="16" font-weight="700">O X fica visualmente mais curto que o D.</text>
      <text x="24" y="533" fill="#515D6C" font-size="14">Referência: versão compacta atual, sem alterações.</text>
    </g>
    <g transform="translate(760 135)">
      <rect width="680" height="570" rx="18" fill="#E7EBF1"/>
      <text x="24" y="42" fill="#11151D" font-size="22" font-weight="700">CANDIDATO · ALTURA D = X</text>
      <text x="24" y="68" fill="#515D6C" font-size="15">D: 235 u · X: 235 u</text>
      <rect x="20" y="92" width="640" height="180" rx="12" fill="#FFFFFF"/>
      <use href="#mark-equal-height" transform="translate(70 54) scale(0.75)"/>
      <rect x="20" y="286" width="640" height="180" rx="12" fill="#0B0D12"/>
      <use href="#mark-equal-height" transform="translate(70 248) scale(0.75)"/>
      <text x="24" y="506" fill="#11151D" font-size="16" font-weight="700">Topo e base do X alinhados aos do D.</text>
      <text x="24" y="533" fill="#515D6C" font-size="14">X +54 u em altura; largura e cruzamento preservados.</text>
    </g>
  </g>
  <text x="40" y="750" fill="#AAB4C3" font-family="Noto Sans, sans-serif" font-size="14">u = unidades do SVG; alturas incluem o traço de 29 u.</text>
</svg>

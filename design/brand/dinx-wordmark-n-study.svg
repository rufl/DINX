<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="780" viewBox="0 0 1480 780" role="img" aria-labelledby="title desc">
  <title id="title">DINX — estudo de legibilidade do N</title>
  <desc id="desc">A forma anterior em arco é comparada com alternativas de N maiúsculo; a versão orgânica foi adotada no wordmark compacto principal.</desc>
  <defs>
    <g id="mark-current" fill="none" stroke="#F4515B" stroke-width="29" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100 242 C100 188 101 120 102 66 C150 76 201 107 234 145 C260 174 261 197 239 218 C211 245 153 263 101 272"/>
      <path d="M294 145 L294 242"/>
      <path d="M342 242 C343 200 344 159 345 130 C346 111 358 112 372 120 C404 141 433 186 457 242"/>
      <path d="M500 96 C535 145 571 196 606 248"/>
      <path d="M606 96 C571 145 535 196 500 248"/>
      <circle cx="294" cy="83" r="17" fill="#F4515B" stroke="none"/>
    </g>
    <g id="mark-n-clear" fill="none" stroke="#F4515B" stroke-width="29" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100 242 C100 188 101 120 102 66 C150 76 201 107 234 145 C260 174 261 197 239 218 C211 245 153 263 101 272"/>
      <path d="M294 145 L294 242"/>
      <path d="M342 272 L342 66 L457 272 L457 66"/>
      <path d="M500 96 C535 145 571 196 606 248"/>
      <path d="M606 96 C571 145 535 196 500 248"/>
      <circle cx="294" cy="83" r="17" fill="#F4515B" stroke="none"/>
    </g>
    <g id="mark-n-organic" fill="none" stroke="#F4515B" stroke-width="29" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100 242 C100 188 101 120 102 66 C150 76 201 107 234 145 C260 174 261 197 239 218 C211 245 153 263 101 272"/>
      <path d="M294 145 L294 242"/>
      <path d="M342 272 C343 202 343 132 342 66 C379 101 420 174 457 272 C456 202 456 132 457 66"/>
      <path d="M500 96 C535 145 571 196 606 248"/>
      <path d="M606 96 C571 145 535 196 500 248"/>
      <circle cx="294" cy="83" r="17" fill="#F4515B" stroke="none"/>
    </g>
  </defs>
  <rect width="1480" height="780" fill="#11151D"/>
  <text x="40" y="58" fill="#F6F7F9" font-family="Noto Sans, sans-serif" font-size="34" font-weight="700">DINX · leitura do N</text>
  <text x="42" y="92" fill="#AAB4C3" font-family="Noto Sans, sans-serif" font-size="17">A forma anterior em arco pode lembrar um A; compare a alternativa estrutural e a opção orgânica adotada.</text>
  <g font-family="Noto Sans, sans-serif">
    <g transform="translate(40 120)">
      <rect width="450" height="550" rx="18" fill="#E7EBF1"/>
      <text x="20" y="34" fill="#11151D" font-size="20" font-weight="700">01 · ANTERIOR</text>
      <text x="20" y="58" fill="#515D6C" font-size="14">Arco único; pode lembrar um A.</text>
      <rect x="20" y="84" width="410" height="180" rx="12" fill="#FFFFFF"/>
      <use href="#mark-current" transform="translate(-18 49) scale(0.68)"/>
      <rect x="20" y="274" width="410" height="180" rx="12" fill="#0B0D12"/>
      <use href="#mark-current" transform="translate(-18 239) scale(0.68)"/>
      <text x="20" y="493" fill="#11151D" font-size="15" font-weight="700">Haste direita ausente</text>
      <text x="20" y="518" fill="#515D6C" font-size="13">A curva passa do topo direto à base.</text>
    </g>
    <g transform="translate(515 120)">
      <rect width="450" height="550" rx="18" fill="#E7EBF1"/>
      <text x="20" y="34" fill="#11151D" font-size="20" font-weight="700">02 · N ESTRUTURAL</text>
      <text x="20" y="58" fill="#515D6C" font-size="14">Duas hastes e diagonal reta.</text>
      <rect x="20" y="84" width="410" height="180" rx="12" fill="#FFFFFF"/>
      <use href="#mark-n-clear" transform="translate(-18 49) scale(0.68)"/>
      <rect x="20" y="274" width="410" height="180" rx="12" fill="#0B0D12"/>
      <use href="#mark-n-clear" transform="translate(-18 239) scale(0.68)"/>
      <text x="20" y="493" fill="#11151D" font-size="15" font-weight="700">Leitura de N mais imediata</text>
      <text x="20" y="518" fill="#515D6C" font-size="13">A altura acompanha o D; pontas arredondadas.</text>
    </g>
    <g transform="translate(990 120)">
      <rect width="450" height="550" rx="18" fill="#E7EBF1"/>
      <text x="20" y="34" fill="#11151D" font-size="20" font-weight="700">03 · N ORGÂNICO</text>
      <text x="20" y="58" fill="#515D6C" font-size="14">Mesma estrutura; traço mais livre.</text>
      <rect x="20" y="84" width="410" height="180" rx="12" fill="#FFFFFF"/>
      <use href="#mark-n-organic" transform="translate(-18 49) scale(0.68)"/>
      <rect x="20" y="274" width="410" height="180" rx="12" fill="#0B0D12"/>
      <use href="#mark-n-organic" transform="translate(-18 239) scale(0.68)"/>
      <text x="20" y="493" fill="#11151D" font-size="15" font-weight="700">Mantém o gesto manual</text>
      <text x="20" y="518" fill="#515D6C" font-size="13">Hastes levemente curvas; diagonal legível.</text>
    </g>
  </g>
  <text x="40" y="724" fill="#D7DDE8" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700">Adotada: 03 · N orgânico — legível como N sem perder o caráter do traço.</text>
  <text x="40" y="749" fill="#7F8A9C" font-family="Noto Sans, sans-serif" font-size="13">A logo compacta principal agora usa a opção 03.</text>
</svg>

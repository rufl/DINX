# greetd configuration for DINX-BSD.
#
# [terminal] is required: without it greetd fails at startup with
# "terminal: current vt invalid: 0" because the FreeBSD worker cannot query
# VT_GETSTATE on an inactive target. ttyv8 is disabled in /etc/ttys, so it is
# reserved for greetd; the rc.d script activates it before starting greetd.
[terminal]
vt = 8
switch = false

# Greeter shown at boot; agreety is built from source together with greetd.
# On successful login it runs the session selector, which execs the Aqueous
# compositor with Pearl as the shell (headless + wayvnc when there is no DRM
# device, which is the case for virtual GPUs on FreeBSD).
[default_session]
command = "agreety --cmd /usr/local/bin/dinx-session-select"
user = "greeter"

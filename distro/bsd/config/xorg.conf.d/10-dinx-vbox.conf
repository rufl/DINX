# DINX-BSD VirtualBox guest: force the vboxvideo DDX so the X server renders
# into the VM window. FreeBSD 15.1 has no DRM driver for VBoxSVGA, so the
# desktop nests on X11 (wlroots X11 backend) instead of scanning out directly.
# Without this file Xorg would fall back to a modesetting driver that cannot
# drive the VirtualBox framebuffer.
Section "Device"
    Identifier "DINX-VBox"
    Driver "vboxvideo"
EndSection

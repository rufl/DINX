insmod font
insmod part_msdos
insmod part_gpt
insmod regexp

source /boot/grub/variable.cfg
source /boot/grub/defaults.cfg

if loadfont /boot/grub/unicode.pf2; then
    set gfxmode=auto
    set gfxpayload=keep
    insmod all_video
    insmod gfxterm
    if terminal_output --append gfxterm; then
        terminal_output --remove console
    else
        set disable_gfxterm=true
    fi
else
    set disable_gfxterm=true
fi

if [ "${disable_gfxterm}" != "true" -a -f "${grub_theme}" ]; then
    insmod gfxmenu
    themedir=""
    regexp -s themedir '^(.*)/.*$' "${grub_theme}"
    for themefont in $themedir/*.pf2 $themedir/f/*.pf2; do
        if [ -f "${themefont}" ]; then
            loadfont "${themefont}"
        fi
    done
    for imagetype in jpg jpeg png tga; do
        for themeimage in ${themedir}/*.${imagetype}; do
            if [ -f "${themeimage}" ]; then
                if [ "${imagetype}" = "jpg" ]; then
                    insmod jpeg
                else
                    insmod "${imagetype}"
                fi
            fi
        done
    done
    theme=${grub_theme}
    export theme
fi

set default=0
set timeout=6
set timeout_style=menu
set auto=""
if [ -n "${iso_path}" ]; then
    set auto="img_dev=/dev/disk/by-uuid/${rootuuid} img_loop=${iso_path}"
fi
export auto

set kopts="quiet splash"
for kopt in "${clinput}" "${bootlang}" "${keyboard}" "${timezone}" "${hwclock}" "${auto}"; do
    if [ -n "${kopt}" ]; then
        set kopts="${kopts} ${kopt}"
    fi
done

source /boot/grub/kernels.cfg

if [ "$grub_platform" = "efi" ]; then
    menuentry "Boot to the Firmware/BIOS" --class=firmware {
        fwsetup
    }
fi

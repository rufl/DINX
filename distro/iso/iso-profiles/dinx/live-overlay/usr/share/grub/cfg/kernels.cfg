if cpuid -l; then
    title=""
    for kopt in x86_64 $kopts @kopts@; do
        if [ -n "$title" ]; then
            title="$title $kopt"
        else
            title="$kopt"
        fi
    done
    menuentry "Start DINX Linux" --class=dinx "$title @ro_opts@" {
        linux /boot/vmlinuz-$2
        initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
    }
    # Legacy BIOS/MBR machines without a working interrupt remap or KMS path
    # (AMD E-350 "Zacate" and similar pre-2012 chipsets) stall after
    # `do_IRQ: ... No irq handler for vector`. Interrupt polling plus the
    # framebuffer driver off keeps the live session bootable on those boards.
    menuentry "Start DINX Linux (compatibility)" --class=dinx "$title @ro_opts@" {
        linux /boot/vmlinuz-$2 noapic irqpoll nomodeset
        initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
    }
fi

if cpuid -l; then
    title=""
    for kopt in x86_64 $kopts @kopts@; do
        if [ -n "$title" ]; then
            title="$title $kopt"
        else
            title="$kopt"
        fi
    done
    menuentry "Start DINX Linux" --class=dinx "$title @ro_opts@" {
        linux /boot/vmlinuz-$2
        initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
    }
    # Legacy BIOS/MBR machines without a working IO-APIC interrupt route
    # (AMD E-350 "Zacate" and similar pre-2012 chipsets, such as the HP
    # dm1) stall after `do_IRQ: ... No irq handler for vector`. Interrupt
    # polling keeps the PS/2, ATA and ACPI interrupts usable there while
    # leaving KMS and Plymouth enabled, so the Wayland session still
    # starts; add `nomodeset` manually only for a GPU driver hang.
    menuentry "Start DINX Linux (compatibility)" --class=dinx "$title @ro_opts@" {
        linux /boot/vmlinuz-$2 noapic irqpoll
        initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
    }
    # `nomodeset` kills KMS for GPUs whose driver hangs before any console
    # appears (AMD E-350 Zacate / Radeon HD 6310 on the HP dm1 shows a black
    # screen with `noapic irqpoll` alone). Text-mode live session; Plymouth
    # is off because there is no KMS to draw it.
    menuentry "Start DINX Linux (safe graphics)" --class=dinx "$title @ro_opts@" {
        linux /boot/vmlinuz-$2 noapic irqpoll nomodeset plymouth.enable=0
        initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
    }
    # Full kernel console instead of the splash: shows where a legacy laptop
    # actually stalls (GPU modeset vs interrupt routing vs storage). The
    # shared $kopts prefix already carries `quiet`, so `ignore_loglevel` is
    # required — param ordering cannot be relied on to override it.
    menuentry "Start DINX Linux (verbose boot)" --class=dinx "$title @ro_opts@" {
        linux /boot/vmlinuz-$2 noapic irqpoll ignore_loglevel loglevel=8 plymouth.enable=0 vt.default_utf8=0
        initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
    }
fi

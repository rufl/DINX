---
live-session:
  user: dinx
  password: dinx
  autologin: false
  use-xlibre: false
  services:
    - metalog
    - NetworkManager
    - greetd
  user-services:
    - dbus
    - pipewire
    - pipewire-pulse
    - wireplumber

rootfs:
  packages:
    - accountsservice
    - artix-grub-live
    - btrfs-progs
    - calamares
    - calamares-extensions
    - dinit
    - dinit-rc
    - dosfstools
    - e2fsprogs
    - efibootmgr
    - elogind
    - greetd
    - greetd-regreet
    - grub
    - mangowm
    - mesa
    - networkmanager
    - noctalia
    - qt6-wayland
    - pipewire
    - pipewire-pulse
    - polkit
    - scenefx
    - seatd
    - squashfs-tools
    - wayland
    - wireplumber
    - xdg-desktop-portal
    - xdg-desktop-portal-wlr
    - xorg-xwayland
    - mkinitcpio-nfs-utils
  packages-init:
    dinit:
      - userspawn-dinit
      - metalog-dinit
      - networkmanager-dinit
      - elogind-dinit
      - dbus-dinit
      - pipewire-dinit
      - pipewire-pulse-dinit
      - wireplumber-dinit
      - greetd-dinit
      - artix-live-dinit
livefs:
  packages:
    - artix-grub-live
    - mkinitcpio-nfs-utils
    - squashfs-tools
  packages-init:
    dinit:
      - artix-live-dinit
      - userspawn-dinit
      - networkmanager-dinit
      - dbus-dinit
      - elogind-dinit
      - pipewire-dinit
      - pipewire-pulse-dinit
      - wireplumber-dinit

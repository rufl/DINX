---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 1GiB
    minimumSize: 64MiB
    label: "EFI"

userSwapChoices:
    - none
    - small
    - suspend
    - file

luksGeneration: luks1
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none
initialSwapChoice: none
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs"]
requiredPartitionTableType: ["msdos", "gpt"]
directoryFilesystemRestrictions:
    - directory: "/"
      allowedFilesystemTypes: ["ext4", "btrfs"]
    - mountpoint: "efi"
      allowedFilesystemTypes: ["fat32"]
      onlyWhenMountpoint: true
essentialMounts: ["live-*", "control", "ventoy"]
lvm:
    enable: false

---
command: artix-service
services:
  - name: "NetworkManager"
    action: "enable"
    mandatory: true
  - name: "elogind"
    action: "enable"
    mandatory: true
  - name: "greetd"
    action: "enable"
    mandatory: true
  - name: "getty@tty2"
    action: "enable"
    mandatory: true
  - name: "getty@tty3"
    action: "enable"
    mandatory: true

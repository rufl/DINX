---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - audio
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true

sudoersGroup: wheel
sudoersConfigureWithGroup: false
setRootPassword: true
doReusePassword: false
displayAutologin: false
doAutologin: false

passwordRequirements:
    minLength: 8
    maxLength: 128

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: /bin/fish
    forbidden_names: [root]
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "dinx-${cpu}"
    forbidden_names: [localhost]

presets:
    fullName:
        editable: true
    loginName:
        editable: true

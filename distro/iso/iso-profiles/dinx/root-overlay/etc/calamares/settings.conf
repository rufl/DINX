---
modules-search: [ local ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - notesqml
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - initcpiocfg
  - initcpio
  - packages
  - users
  - networkcfg
  - hwclock
  - services-artix
  - postcfg
  - bootloader
  - umount
- show:
  - finished

branding: dinx
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false

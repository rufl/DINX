[GTK]
# DINX uses the same dark palette and Cantarell typography as the session.
application_prefer_dark_theme = true
theme_name = "DINX"
icon_theme_name = "Adwaita"
cursor_theme_name = "Adwaita"
font_name = "Cantarell 11"
cursor_blink = true

[commands]
reboot = ["loginctl", "reboot"]
poweroff = ["loginctl", "poweroff"]

[appearance]
greeting_msg = "Bem-vindo ao DINX"

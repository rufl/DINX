source=/etc/mango/config.conf
tag_num=2
source_optional=~/.config/mango/config.conf

env=XDG_CURRENT_DESKTOP,Mango
env=TERMINAL,dinx-terminal
exec_once=noctalia
exec_once=bc250-control-centerd
exec_once=lxqt-policykit-agent
exec_once=thunar --daemon
exec_once=/usr/local/libexec/dinx-idle
bind=SUPER,l,spawn,/usr/local/libexec/dinx-lock
bind=XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bind=XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=SUPER,Return,spawn,dinx-terminal

# DINX opens new applications as floating windows; toggle individual windows with Super+Space.
tagrule=id:*,open_as_floating:1
enable_floating_snap=1
float_full_to_top=1
bind=SUPER,space,togglefloating,
bind=SUPER,r,reload_config,

# DINX uses one palette for Noctalia, terminals, GTK and Qt consumers.
[plugins]
enabled = ["dinx/performance"]

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "dinx/performance:gaming"

[[control_center.shortcuts]]
type = "notification"

[theme]
mode = "dark"
shell_mode = "follow"
source = "custom"
custom_palette = "DINX"
sync_color_scheme = true

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["btop", "foot", "ghostty", "gtk3", "gtk4", "kcolorscheme", "qt"]
enable_community_templates = false
community_ids = []

[bar]
order = ["main"]

[bar.main]
position = "top"
enabled = true
reserve_space = true
layer = "top"
thickness = 36
background_opacity = 1.0
compositor_blur = false
border = "outline"
border_width = 1.0
radius = 0
concave_edge_corners = false
margin_ends = 0
margin_edge = 0
padding = 12
widget_spacing = 6
capsule = true
start = ["launcher", "workspaces"]
center = ["clock"]
end = ["screenshot", "clipboard", "tray", "network", "bluetooth", "volume", "battery", "notifications", "control-center", "session"]

[widget.screenshot.actions]
left = "screenshot-region"

[widget.network]
show_label = false

[widget.bluetooth]
show_label = false

[widget.volume]
show_label = true

[widget.battery]
type = "battery"
display_mode = "glyph"
show_label = true

[widget.clipboard]
glyph = "clipboard"


[widget.tray]
drawer = true
drawer_columns = 3
drawer_item_size = 20
hide_passive = true

[dock]
enabled = true
position = "bottom"
reserve_space = true
layer = "top"
icon_size = 42
margin_edge = 8
margin_ends = 160
launcher_position = "none"
pinned = ["firefox", "dinxpanel", "dinitui", "io.github.movacx.bc250-control-center", "org.aqueous.Phyto", "com.pori.app", "foot", "com.noctty.NOCTTY", "com.noctty.NoctEd"]

[shell]
font_family = "Noto Sans"
settings_window_translucent = false

[shell.animation]
enabled = false

[shell.panel]
transparency_mode = "solid"

[shell.screenshot]
save_to_file = true
copy_to_clipboard = true
freeze_screen = true

# Dinit service logs are excluded from the compressed image; recreate their directory at boot.
d /var/log/dinit 0755 root root -
# agreety remembers the last chosen session and needs a writable cache. Its
# `greeter` account (created by greetd's sysusers) has HOME=/, so the cache is
# provisioned here and pointed at by XDG_CACHE_HOME in etc/greetd/config.toml.
d /var/cache/agreety 0700 greeter greeter -

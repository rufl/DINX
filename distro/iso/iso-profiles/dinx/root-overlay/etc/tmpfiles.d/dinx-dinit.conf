# Dinit service logs are excluded from the compressed image; recreate their directory at boot.
d /var/log/dinit 0755 root root -
# Keep the greeter's Aqueous XDG state and Pearl cache writable by its dedicated account.
d /var/lib/pearl-greeter 0700 pearl-greeter pearl-greeter -
d /var/cache/pearl-greeter 0700 pearl-greeter pearl-greeter -

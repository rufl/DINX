# DINX service performance profiles.
# Built-ins deliberately exclude NetworkManager, D-Bus, PipeWire, WirePlumber,
# elogind, greetd, seatd, metalog, and other essential desktop services.
# Edit ~/.config/dinx/dinitui/profiles.conf for custom policies.

[profile.normal]
description = Desktop services
enable = bluetoothd
disable =

[profile.lite]
description = Reduced optional background services
enable =
disable = bluetoothd

[profile.gaming]
description = Gaming with controller and security services preserved
enable = bluetoothd
disable =
